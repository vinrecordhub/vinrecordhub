<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96"/>
  <link rel="shortcut icon" href="/favicon.ico"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <meta name="theme-color" content="#0b0d1c"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script>(function(){try{var t=localStorage.getItem('vrh-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','dark')}})();</script>
  <link rel="stylesheet" href="/assets/theme.css"/>
  <title>Log In — VINRecordHub</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"/></noscript>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{ --max:1160px; --pad:clamp(1.25rem,5vw,3.5rem); }
    html{overflow-x:hidden}
    body{background:var(--bg);color:var(--text);
      font-family:'Inter',-apple-system,sans-serif;font-weight:400;
      min-height:100vh;-webkit-font-smoothing:antialiased}
    body::before{content:'';position:fixed;inset:0;
      background-image:
        linear-gradient(var(--a-bdr) 1px,transparent 1px),
        linear-gradient(90deg,var(--a-bdr) 1px,transparent 1px);
      background-size:72px 72px;
      mask-image:radial-gradient(ellipse 60% 50% at 50% 0%,black 0%,transparent 100%);
      opacity:.35;pointer-events:none;z-index:0}

    /* NAV */
    .nav-shell{position:relative;z-index:10;
      background:var(--overlay-nav);backdrop-filter:blur(20px) saturate(1.8);
      border-bottom:1px solid var(--border)}
    nav{max-width:var(--max);margin:0 auto;padding:0 var(--pad);
      height:62px;display:flex;align-items:center;justify-content:space-between}
    .logo{display:flex;align-items:center;gap:.5rem;font-size:1rem;font-weight:800;letter-spacing:-.04em;
      text-decoration:none;color:var(--text)}
    .logo-mark{flex-shrink:0;display:block}
    .logo-r{color:var(--accent-primary)}
    .logo-h{color:var(--text-faint);font-weight:400;letter-spacing:-.02em}

    /* AUTH SHELL */
    .auth-wrap{position:relative;z-index:1;min-height:calc(100vh - 62px);
      display:flex;align-items:center;justify-content:center;
      padding:2.5rem var(--pad) 4rem}
    .auth-card{width:100%;max-width:420px;background:var(--surface);
      border:1px solid var(--border-2);border-radius:20px;padding:2.25rem;
      box-shadow:0 0 0 1px var(--border),0 24px 64px var(--shadow-color-strong),0 0 60px var(--glow)}
    .auth-title{font-size:1.5rem;font-weight:800;letter-spacing:-.04em;margin-bottom:.35rem}
    .auth-sub{font-size:.85rem;color:var(--text-muted);margin-bottom:1.75rem;line-height:1.6}

    /* GOOGLE BUTTON */
    .btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:.65rem;
      background:var(--bg-elevated);border:1px solid var(--border-2);color:var(--text);
      font-family:'Inter',sans-serif;font-weight:600;font-size:.88rem;
      padding:.85rem 1rem;border-radius:10px;cursor:pointer;min-height:44px;
      transition:background .2s var(--ease),border-color .2s var(--ease),transform .15s var(--ease)}
    .btn-google:hover{background:color-mix(in oklab,var(--text) 6%,var(--bg-elevated));border-color:var(--border-3)}
    .btn-google:active{transform:scale(0.98)}

    /* DIVIDER */
    .divider{display:flex;align-items:center;gap:.85rem;margin:1.5rem 0;
      font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

    /* FIELDS */
    .fg{margin-bottom:1.1rem}
    .fl-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem}
    .fl{display:block;font-size:.67rem;font-weight:700;letter-spacing:.1em;
      text-transform:uppercase;color:var(--text-faint)}
    .fl-link{font-size:.75rem;font-weight:500;color:var(--accent-primary);
      text-decoration:none;letter-spacing:0;text-transform:none}
    .fl-link:hover{text-decoration:underline}
    .fi{width:100%;background:var(--bg-elevated);border:1px solid var(--border-2);
      border-radius:10px;padding:.85rem 1.1rem;color:var(--text);
      font-family:'Inter',sans-serif;font-size:.92rem;outline:none;min-height:44px;
      transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
    .fi::placeholder{color:var(--text-faint)}
    .fi:focus{border-color:var(--a-bdr);box-shadow:0 0 0 3px var(--a-dim)}
    .fi.err{border-color:var(--r-bdr);box-shadow:0 0 0 3px var(--r-dim)}

    /* SUBMIT */
    .btn-submit{width:100%;background:var(--cta);color:var(--on-cta);border:none;
      border-radius:10px;padding:.9rem 1.4rem;font-family:'Inter',sans-serif;
      font-weight:700;font-size:.92rem;cursor:pointer;min-height:44px;margin-top:.4rem;
      transition:opacity .15s,transform .15s var(--ease),box-shadow .15s}
    .btn-submit:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 8px 24px color-mix(in oklab,var(--cta) 30%,transparent)}
    .btn-submit:active{transform:scale(0.99)}
    .btn-submit:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}

    /* MESSAGES */
    .msg{font-size:.82rem;padding:.7rem 1rem;border-radius:8px;margin-top:1rem;display:none;line-height:1.5}
    .msg.err{display:block;background:var(--r-dim);border:1px solid var(--r-bdr);color:var(--danger)}
    .msg.ok{display:block;background:var(--g-dim);border:1px solid var(--g-bdr);color:var(--success)}

    .auth-foot{text-align:center;font-size:.83rem;color:var(--text-muted);margin-top:1.75rem}
    .auth-foot a{color:var(--accent-primary);text-decoration:none;font-weight:600}
    .auth-foot a:hover{text-decoration:underline}

    :focus-visible{outline:2px solid var(--accent-primary);outline-offset:3px;border-radius:4px}

    @media(max-width:600px){
      :root{--pad:1.25rem}
      nav{height:54px}
      .auth-card{padding:1.75rem}
      .fi{font-size:16px}
    }
  </style>
</head>
<body>

<div class="nav-shell">
  <nav aria-label="Main navigation">
    <a href="/" class="logo">
      <img class="logo-mark" src="/favicon-96x96.png" width="24" height="24" alt="" aria-hidden="true"/>
      VIN<span class="logo-r">Record</span><span class="logo-h">Hub</span>
    </a>
    <a href="https://www.instagram.com/vinrecordhub/" target="_blank" rel="noopener" class="nav-ig" aria-label="Follow VINRecordHub on Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg></a><button class="theme-toggle" data-theme-toggle type="button" aria-label="Switch to light theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button>
  </nav>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to buy credits and generate reports.</p>

    <button class="btn-google" id="googleBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35 26.9 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.5 36.4 44 30.8 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <form id="loginForm" novalidate>
      <div class="fg">
        <label class="fl" for="email">Email</label>
        <input class="fi" type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email" required/>
      </div>
      <div class="fg">
        <div class="fl-row">
          <label class="fl" for="password">Password</label>
          <a class="fl-link" href="/reset-password">Forgot password?</a>
        </div>
        <input class="fi" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
      </div>
      <button class="btn-submit" type="submit" id="submitBtn">Log In</button>
      <div class="msg err" id="errMsg" role="alert" aria-live="assertive"></div>
    </form>

    <p class="auth-foot">Don't have an account? <a href="/signup" id="signupLink">Sign up</a></p>
  </div>
</div>

<script src="/assets/theme.js" defer></script>
<script src="/assets/vendor/supabase.js"></script>
<script src="/assets/supabase-config.js"></script>
<script src="/assets/auth.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var next = params.get('next') || '/account';
  // same-origin relative paths only — blocks open redirects
  if (!/^\/[^\/\\]/.test(next)) next = '/account';

  var signupLink = document.getElementById('signupLink');
  signupLink.href = '/signup?next=' + encodeURIComponent(next);

  vrhAuth.getSession().then(function (session) {
    if (session) window.location.href = next;
  });

  var form = document.getElementById('loginForm');
  var submitBtn = document.getElementById('submitBtn');
  var errMsg = document.getElementById('errMsg');

  document.getElementById('googleBtn').addEventListener('click', function () {
    vrhAuth.signInGoogle();
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errMsg.className = 'msg';
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    if (!email || !password) {
      errMsg.textContent = 'Please enter your email and password.';
      errMsg.className = 'msg err';
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';
    try {
      var res = await vrhAuth.signInEmail(email, password);
      if (res.error) throw res.error;
      window.location.href = next;
    } catch (err) {
      errMsg.textContent = err.message || 'Log in failed — please check your credentials.';
      errMsg.className = 'msg err';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });
})();
</script>
</body>
</html>
